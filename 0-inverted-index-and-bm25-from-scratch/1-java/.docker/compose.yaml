services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  bm25-search-service:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3011:3000"
    depends_on:
      redis:
        condition: service_healthy
