name: vector-search-csharp

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: vectorsearch
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d vectorsearch"]
      interval: 3s
      timeout: 3s
      retries: 20

  vector-search-service:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3020"
    environment:
      PORT: 3020
      DATABASE_URL: "Host=postgres;Port=5432;Username=search;Password=search;Database=vectorsearch"
    depends_on:
      postgres:
        condition: service_healthy
