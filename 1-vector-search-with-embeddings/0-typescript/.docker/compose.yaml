name: vector-search-typescript

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: vectorsearch
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d vectorsearch"]
      interval: 3s
      timeout: 3s
      retries: 20

  vector-search-service:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3020"
    environment:
      PORT: 3020
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: search
      PG_PASSWORD: search
      PG_DATABASE: vectorsearch
      TRANSFORMERS_CACHE: /app/.cache
    volumes:
      - xenova-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  xenova-cache:
